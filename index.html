<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7f0">
  <meta name="description" content="Ismingizga atalgan samimiy tug‘ilgan kun tabrigi.">
  <title>Tug‘ilgan kuning bilan!</title>
  <style>
    :root { color-scheme: light; --ink: #42283b; --muted: #806b79; --rose: #c65377; --rose-dark: #a83c61; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 22px;
      color: var(--ink); background: radial-gradient(ellipse at 10% 12%, #ffe1d6 0, transparent 38%),
      radial-gradient(ellipse at 92% 88%, #eadfff 0, transparent 38%), #fff8f3;
      font-family: Georgia, "Times New Roman", serif;
    }
    .card {
      width: min(100%, 480px); padding: clamp(28px, 7vw, 48px); text-align: center;
      border: 1px solid rgba(255,255,255,.9); border-radius: 30px;
      background: rgba(255,255,255,.82); box-shadow: 0 24px 70px rgba(113,61,83,.13);
      backdrop-filter: blur(10px);
    }
    .cake { margin-bottom: 10px; font-family: system-ui, sans-serif; font-size: 48px; }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 2.8rem); line-height: 1.12; letter-spacing: -.045em; }
    .intro { margin: 12px 0 28px; color: var(--muted); font-family: system-ui, sans-serif; font-size: .98rem; line-height: 1.6; }
    label { display: block; margin-bottom: 8px; color: #624655; font-family: system-ui, sans-serif; font-size: .88rem; font-weight: 650; text-align: left; }
    input {
      width: 100%; min-height: 52px; padding: 0 15px; border: 1px solid #ead8df; border-radius: 13px;
      outline: none; background: #fffdfc; color: var(--ink); font: 1rem system-ui, sans-serif; transition: .2s;
    }
    input::placeholder { color: #b59eaa; }
    input:focus { border-color: #db87a3; box-shadow: 0 0 0 4px rgba(198,83,119,.12); }
    button {
      width: 100%; min-height: 51px; margin-top: 13px; border: 0; border-radius: 13px;
      background: var(--rose); color: white; cursor: pointer; font: 650 .98rem system-ui, sans-serif;
      transition: background .18s, transform .18s, box-shadow .18s;
    }
    button:hover { background: var(--rose-dark); box-shadow: 0 8px 18px rgba(198,83,119,.2); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid #e9a5b9; outline-offset: 3px; }
    .error { min-height: 1.25em; margin: 8px 0 0; color: #a83252; font: .86rem system-ui, sans-serif; text-align: left; }
    .result { display: none; margin-top: 22px; padding: 21px 18px; border: 1px solid #f3d9df; border-radius: 18px; background: linear-gradient(140deg,#fff3f0,#fbf2ff); animation: appear .35s ease-out both; }
    .result.visible { display: block; }
    .greeting { margin: 0; color: #a83c61; font-size: clamp(1.35rem, 5vw, 1.65rem); font-weight: 700; overflow-wrap: anywhere; }
    .wish { margin: 12px 0 0; color: #634b59; font-size: 1.04rem; line-height: 1.65; }
    .again { display: none; width: auto; min-height: 40px; margin: 13px auto 0; padding: 0 15px; border: 1px solid #ead8df; background: white; color: #704d5d; font-size: .88rem; }
    .again.visible { display: inline-block; }
    .again:hover { background: #fff8fa; box-shadow: none; }
    @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 480px) { body { padding: 15px; } .card { border-radius: 24px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="cake" aria-hidden="true">🎂</div>
    <h1>Tug‘ilgan kuning bilan!</h1>
    <p class="intro">Ismingizni yozing — sizga atalgan tabrikni aytamiz.</p>

    <form id="birthday-form" novalidate>
      <label for="name">Ismingiz</label>
      <input id="name" type="text" placeholder="Ismingizni kiriting" autocomplete="given-name" maxlength="60" aria-describedby="error" required>
      <p id="error" class="error" aria-live="polite"></p>
      <button type="submit">Tabrikni ko‘rish <span aria-hidden="true">♥</span></button>
    </form>

    <section id="result" class="result" aria-live="polite" aria-atomic="true">
      <p id="greeting" class="greeting"></p>
      <p id="wish" class="wish"></p>
    </section>
    <button id="again" class="again" type="button">Boshqa ism yozish</button>
  </main>

  <script>
    const form = document.getElementById('birthday-form');
    const nameInput = document.getElementById('name');
    const error = document.getElementById('error');
    const result = document.getElementById('result');
    const greeting = document.getElementById('greeting');
    const wish = document.getElementById('wish');
    const again = document.getElementById('again');
    const wishes = [
      'Yangi yoshingiz quvonch, mehr va unutilmas go‘zal lahzalarga boy bo‘lsin. Doimo kulib yuring!',
      'Ko‘nglingizdagi eng ezgu tilaklar ushalsin. Hayotingiz mehr, baxt va yorug‘ kunlarga to‘lsin!',
      'Har bir kuningiz bugungidek fayzli o‘tsin. Sizga sihat-salomatlik, cheksiz baxt va ko‘p quvonch tilayman!',
      'Yangi yoshingiz yangi orzular va chiroyli imkoniyatlar olib kelsin. Yaqinlaringiz mehridan doimo bahramand bo‘ling!'
    ];

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const name = nameInput.value.trim();
      if (!name) {
        error.textContent = 'Avval ismingizni yozing.';
        nameInput.setAttribute('aria-invalid', 'true');
        nameInput.focus();
        return;
      }
      error.textContent = '';
      nameInput.removeAttribute('aria-invalid');
      greeting.textContent = `Aziz ${name}, tug‘ilgan kuningiz muborak!`;
      wish.textContent = wishes[Math.floor(Math.random() * wishes.length)];
      result.classList.remove('visible');
      requestAnimationFrame(() => result.classList.add('visible'));
      again.classList.add('visible');
    });

    nameInput.addEventListener('input', () => {
      if (nameInput.value.trim()) {
        error.textContent = '';
        nameInput.removeAttribute('aria-invalid');
      }
    });

    again.addEventListener('click', () => {
      nameInput.value = '';
      error.textContent = '';
      result.classList.remove('visible');
      again.classList.remove('visible');
      nameInput.removeAttribute('aria-invalid');
      nameInput.focus();
    });
  </script>
</body>
</html>
